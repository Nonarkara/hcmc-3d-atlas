<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">HCMC atlas architecture</title><desc id="desc">Browser to Worker to R2. External map services reach the browser; dashboard feeds reach the Worker. Curated areas and landmarks are committed assets.</desc><rect width="1200" height="640" fill="#0d1117"/><g font-family="Arial,Helvetica,sans-serif" fill="#e6edf3"><text x="48" y="54" font-size="15" fill="#f59e0b" letter-spacing="2">REQUEST / RESPONSE</text><text x="48" y="102" font-size="34" font-weight="700">How the atlas gets its layers</text><rect x="48" y="168" width="308" height="180" fill="#161b22" stroke="#56606c"/><text x="68" y="197" font-size="12" fill="#8b949e" letter-spacing="2">01 / VIEW</text><text x="68" y="232" font-size="22" fill="#e6edf3" font-weight="700">Browser</text><text x="68" y="264" font-size="15" fill="#e6edf3" >public/index.html + app.js</text><text x="68" y="288" font-size="15" fill="#e6edf3" >MapLibre + pmtiles protocol</text><text x="68" y="312" font-size="15" fill="#e6edf3" >Area navigation and inspection</text><rect x="430" y="168" width="324" height="180" fill="#161b22" stroke="#f59e0b"/><text x="450" y="197" font-size="12" fill="#f59e0b" letter-spacing="2">02 / ROUTE</text><text x="450" y="232" font-size="22" fill="#e6edf3" font-weight="700">Cloudflare Worker</text><text x="450" y="264" font-size="15" fill="#e6edf3" >src/index.ts</text><text x="450" y="288" font-size="15" fill="#e6edf3" >Static assets + /api/atlas/*</text><text x="450" y="312" font-size="15" fill="#e6edf3" >Range-aware archive responses</text><rect x="828" y="168" width="324" height="180" fill="#161b22" stroke="#56606c"/><text x="848" y="197" font-size="12" fill="#8b949e" letter-spacing="2">03 / STREAM</text><text x="848" y="232" font-size="22" fill="#e6edf3" font-weight="700">R2 archives</text><text x="848" y="264" font-size="15" fill="#e6edf3" >HCMC_TILES binding</text><text x="848" y="288" font-size="15" fill="#e6edf3" >buildings/hcmc-v3.pmtiles</text><text x="848" y="312" font-size="15" fill="#e6edf3" >waterways + CBD archives</text><path d="M356 253H430" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M423 248l7 5-7 5" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M754 253H828" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M821 248l7 5-7 5" fill="none" stroke="#f59e0b" stroke-width="2"/><rect x="48" y="400" width="308" height="166" fill="#0d1117" stroke="#56606c"/><text x="68" y="429" font-size="12" fill="#8b949e" letter-spacing="2">EXTERNAL / BROWSER</text><text x="68" y="464" font-size="22" fill="#e6edf3" font-weight="700">External map services</text><text x="68" y="496" font-size="15" fill="#e6edf3" >Esri imagery + MapLibre fonts</text><text x="68" y="520" font-size="15" fill="#e6edf3" >CDN libraries loaded by HTML</text><rect x="430" y="400" width="324" height="166" fill="#0d1117" stroke="#56606c"/><text x="450" y="429" font-size="12" fill="#8b949e" letter-spacing="2">EXTERNAL / WORKER</text><text x="450" y="464" font-size="22" fill="#e6edf3" font-weight="700">Dashboard feeds</text><text x="450" y="496" font-size="15" fill="#e6edf3" >hcmc.nonarkara.org</text><text x="450" y="520" font-size="15" fill="#e6edf3" >Cached upstream JSON</text><text x="450" y="544" font-size="15" fill="#e6edf3" >Not bundled with this repo</text><rect x="828" y="400" width="324" height="166" fill="#0d1117" stroke="#56606c"/><text x="848" y="429" font-size="12" fill="#8b949e" letter-spacing="2">LOCAL / SOURCE</text><text x="848" y="464" font-size="22" fill="#e6edf3" font-weight="700">Committed static data</text><text x="848" y="496" font-size="15" fill="#e6edf3" >hcmc-areas.json</text><text x="848" y="520" font-size="15" fill="#e6edf3" >hcmc-landmarks.geojson</text><text x="848" y="544" font-size="15" fill="#e6edf3" >District list in the Worker</text><path d="M202 348v52M592 348v52M990 400v-26H730v-26" fill="none" stroke="#56606c" stroke-width="2"/><text x="48" y="614" font-size="15" fill="#8b949e" >R2 objects are separate data assets. The buildings API returns a pointer, not a geometry query.</text></g></svg>
